; PlatformIO Configuration — NexusControl ESP32 Firmware
;
; Cada [env:...] produce un binario independiente.
; Compilar:  pio run -e puerta-peatonal
; Flashear:  pio run -e puerta-peatonal -t upload
; Monitor:   pio device monitor
; Tests:     pio test -e native

[platformio]
default_envs = puerta-peatonal
src_dir = firmware

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv
lib_deps =
    ottowinter/ESPAsyncWebServer-esphome@^3.3.0
    bblanchon/ArduinoJson@^7.0.0

[env:puerta-peatonal]
board = esp32dev
build_src_filter = +<puerta-peatonal/>

; Entorno nativo para correr tests sin hardware ESP32
[env:native]
platform = native
framework =
lib_deps =
test_build_src = no
